! Generated by fabric/generate.py from intent.yml - do not edit by hand
frr defaults datacenter
hostname leaf2
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.12/32
!
interface eth1
 description to-spine1
 ip address 10.1.1.3/31
!
interface eth2
 description to-spine2
 ip address 10.1.2.3/31
!
bfd
 profile fast
  transmit-interval 100
  receive-interval 100
  detect-multiplier 3
 exit
 !
exit
!
router bgp 65002
 bgp router-id 10.0.0.12
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.1.1.2 remote-as 65100
 neighbor 10.1.1.2 description spine1
 neighbor 10.1.1.2 bfd profile fast
 neighbor 10.1.2.2 remote-as 65100
 neighbor 10.1.2.2 description spine2
 neighbor 10.1.2.2 bfd profile fast
 !
 ! Underlay: advertise the loopback (also the VXLAN tunnel endpoint on leaves)
 address-family ipv4 unicast
  network 10.0.0.12/32
  maximum-paths 8
 exit-address-family
 !
 ! Overlay: EVPN carries MAC/IP reachability between leaves
 address-family l2vpn evpn
  neighbor 10.1.1.2 activate
  neighbor 10.1.2.2 activate
  advertise-all-vni
 exit-address-family
!
