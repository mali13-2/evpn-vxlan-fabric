! Generated by fabric/generate.py from intent.yml - do not edit by hand
frr defaults datacenter
hostname spine1
service integrated-vtysh-config
!
interface lo
 ip address 10.0.0.1/32
!
interface eth1
 description to-leaf1
 ip address 10.1.1.0/31
!
interface eth2
 description to-leaf2
 ip address 10.1.1.2/31
!
interface eth3
 description to-leaf3
 ip address 10.1.1.4/31
!
interface eth4
 description to-leaf4
 ip address 10.1.1.6/31
!
router bgp 65100
 bgp router-id 10.0.0.1
 no bgp ebgp-requires-policy
 bgp bestpath as-path multipath-relax
 neighbor 10.1.1.1 remote-as 65001
 neighbor 10.1.1.1 description leaf1
 neighbor 10.1.1.3 remote-as 65002
 neighbor 10.1.1.3 description leaf2
 neighbor 10.1.1.5 remote-as 65003
 neighbor 10.1.1.5 description leaf3
 neighbor 10.1.1.7 remote-as 65004
 neighbor 10.1.1.7 description leaf4
 !
 ! Underlay: advertise the loopback (also the VXLAN tunnel endpoint on leaves)
 address-family ipv4 unicast
  network 10.0.0.1/32
  maximum-paths 8
 exit-address-family
 !
 ! Overlay: EVPN carries MAC/IP reachability between leaves
 address-family l2vpn evpn
  neighbor 10.1.1.1 activate
  neighbor 10.1.1.1 attribute-unchanged next-hop
  neighbor 10.1.1.3 activate
  neighbor 10.1.1.3 attribute-unchanged next-hop
  neighbor 10.1.1.5 activate
  neighbor 10.1.1.5 attribute-unchanged next-hop
  neighbor 10.1.1.7 activate
  neighbor 10.1.1.7 attribute-unchanged next-hop
 exit-address-family
!
